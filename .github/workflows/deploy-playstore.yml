name: Deploy to Google Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Publish Release Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Security Lint & Audit Check
        run: |
          echo "Running dependency security review..."
          npm audit --audit-level=critical || true

      - name: Prepare Web Assets & Sync Capacitor
        run: |
          mkdir -p www
          cp -r index.html app.js style.css firebase-config.js firebase-service.js favicon.svg www/
          npx cap sync android

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            echo "Release keystore successfully decoded."
          else
            echo "::warning ::KEYSTORE_BASE64 secret not set! Release build will fall back to local/default keys."
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release Android App Bundle (.aab)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: garbaconnect-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Deploy to Google Play Console (Internal Track)
        if: env.PLAY_CONFIG_EXISTS != ''
        env:
          PLAY_CONFIG_EXISTS: ${{ secrets.PLAY_CONFIG_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.harshalbane.garbaconnect
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: metadata/
